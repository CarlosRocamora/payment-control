name: Private Payment CI

on: 
    workflow_dispatch:
    push:
        branches: ["main"]
    pull_request:
        branches: ["main"]

jobs:
    test:
        runs-on: ubuntu-latest

        steps:
        - name: Fazer Checkout Do Repositório
          uses: actions/checkout@v4

        - name: Definir Versão Do Node.js 
          uses: actions/setup-node@v4 
          with:
            node-version: "20.x"
        
        - name: Instalar Dependências
          run: npm install

        - name: Iniciar A Api
          run: npm start &

        - name: Aguardar A Api Iniciar
          run: sleep 10

        - name: Executar Os Testes
          run: npm test